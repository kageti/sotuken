<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" type="image/x-icon">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>マイページ</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f8f9fa; }
    .card:hover { transform: translateY(-2px); transition: .15s ease; }
  </style>
</head>
<body>

  <header class="py-3 border-bottom bg-white mb-3">
    <div class="container d-flex justify-content-between">
      <h4 class="m-0">マイページ</h4>
      <nav class="d-flex gap-2">
        <a href="/" class="btn btn-outline-secondary btn-sm">ホーム</a>
        <a href="/search" class="btn btn-outline-secondary btn-sm">商品検索</a>
        <a href="/logout" class="btn btn-outline-danger btn-sm">ログアウト</a>
      </nav>
    </div>
  </header>

  <main class="container">

    <div class="row g-4">

      <!-- ユーザー名変更 -->
      <div class="col-md-6">
        <div class="card p-3">
          <h5 class="mb-3">ユーザー名変更</h5>
          <form action="/update-username" method="post">
            <div class="mb-2">
              <label class="form-label small">新しいユーザー名</label>
              <input type="text" name="new_name" class="form-control" required>
            </div>
            <button class="btn btn-primary btn-sm">変更する</button>
          </form>
        </div>
      </div>

      <!-- パスワード変更 -->
      <div class="col-md-6">
        <div class="card p-3">
          <h5 class="mb-3">パスワード変更</h5>
          <form action="/update-password" method="post">
            <div class="mb-2">
              <label class="form-label small">現在のパスワード</label>
              <input type="password" name="current_password" class="form-control" required>
            </div>
            <div class="mb-2">
              <label class="form-label small">新しいパスワード</label>
              <input type="password" name="new_password" class="form-control" minlength="6" required>
            </div>
            <div class="mb-2">
              <label class="form-label small">新しいパスワード（確認）</label>
              <input type="password" name="new_password_confirm" class="form-control" minlength="6" required>
            </div>
            <button class="btn btn-warning btn-sm">変更する</button>
          </form>
        </div>
      </div>

      <!-- ユーザー評価 -->
      <div class="col-md-6">
        <div class="card p-3">
          <h5 class="mb-2">ユーザー評価</h5>
          <p class="mb-0 small">あなたの評価： <strong>{{ user_rating if user_rating else 4.2 }}</strong> / 5.0</p>
          <p class="text-muted small">(DBと連携する前は仮値を表示しています)</p>
        </div>
      </div>

      <!-- お気に入り -->
      <div class="col-md-6">
        <div class="card p-3">
          <h5 class="mb-2">お気に入り商品</h5>
          <p class="small mb-3">登録したお気に入り一覧を見ることができます。</p>
          <a class="btn btn-success btn-sm" href="/favorites">お気に入り商品一覧へ</a>
        </div>
      </div>

    </div>
  </main>
</body>
</html>
