<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>お気に入り商品</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <h1>お気に入り商品</h1>
    <pre>{{ favorites }}</pre>
    
<div class="container py-4">
  <h1 class="h4 mb-3">⭐ お気に入り商品</h1>

  {% if favorites %}
    <table class="table table-hover align-middle">
      <thead class="table-light">
        <tr>
          <th>JANコード</th>
          <th>商品名</th>
        </tr>
      </thead>
      <tbody>
        {% for f in favorites %}
          <tr>
            <td class="text-monospace">{{ f.jan }}</td>
            <td>{{ f.name }}</td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  {% else %}
    <div class="alert alert-secondary">
      お気に入りに登録された商品はありません。
    </div>
  {% endif %}

  <a href="{{ url_for('search_products') }}" class="btn btn-outline-secondary mt-3">
    商品検索へ戻る
  </a>
</div>

</body>
</html>
